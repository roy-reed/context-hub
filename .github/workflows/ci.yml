name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.11"
            coverage: true
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run documented PowerShell CLI smoke
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/run_runbook_smoke.ps1

      - name: Run unit and protocol tests
        if: ${{ !matrix.coverage }}
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Run unit and protocol tests with coverage (report only)
        if: ${{ matrix.coverage }}
        run: |
          python -m pip install --disable-pip-version-check coverage==7.10.7
          python -X utf8 -m coverage run --source=src/context_hub -m unittest discover -s tests -v
          python -m coverage report

      - name: Run synthetic Loop delivery acceptance
        run: python -X utf8 scripts/run_loop_acceptance.py

      - name: Run synthetic multi-project STDIO acceptance
        run: python -X utf8 scripts/run_multiproject_acceptance.py

      - name: Run synthetic v1.1 acceptance
        run: python -X utf8 scripts/run_acceptance.py
