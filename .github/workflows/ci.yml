name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check --no-deps -e .

      - name: Run documented PowerShell CLI smoke
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/run_runbook_smoke.ps1

      - name: Run unit and protocol tests
        run: python -X utf8 -m unittest discover -s tests -v

      - name: Run synthetic multi-project STDIO acceptance
        run: python -X utf8 scripts/run_multiproject_acceptance.py

      - name: Run synthetic v1.1 acceptance
        run: python -X utf8 scripts/run_acceptance.py
